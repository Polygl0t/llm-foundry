[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-foundry"
version = "0.1.0"
description = "Developing foundation models for low-resource languages"
requires-python = ">=3.12"

[project.optional-dependencies]
data = [
    "transformers",
    "datasets",
    "sentencepiece",
    "pandas",
    "numpy",
    "langdetect",
    "datatrove[io,processing]",
    "lxml[html_clean]",
    "stanza",
    "spacy",
    "pyyaml"
]
tokenizer = [
    "transformers",
    "datasets",
    "tokenizers",
    "sentencepiece",
    "protobuf",
    "pandas",
    "tabulate",
    "tqdm",
    "ftfy",
    "jinja2",
]
# NOTE: flash_attn (2) requires --no-build-isolation and must be installed separately:
#   pip3 install flash_attn==2.8.3 --no-build-isolation
distributed = [
    "wheel==0.45.1",
    "packaging==25.0",
    "numpy==2.3.2",
    "transformers==5.14.0",
    "datasets==4.0.0",
    "sentencepiece==0.2.0",
    "accelerate==1.9.0",
    "codecarbon==3.2.9",
    "wandb==0.27.2",
    "trackio==0.32.2",
    "pyyaml==6.0.2",
    "liger-kernel==0.8.0",
    "kernels==0.13.0",
]
synth = [
    "transformers",
    "datasets",
    "vllm",
]
agents = [
    "vllm",
    "accelerate",
    "transformers",
    "smolagents[litellm]>=1.26.0",
    "datasets>=3.0",
    "python-dotenv>=1.0",
    "datasets>=3.0",
    "pyyaml>=6.0",
    "sympy>=1.13",
    "ddgs>=9.0.0",
    "wikipedia-api==0.15.0",
    "markdownify>=0.14.1",
]
trl = [
    "setuptools",
    "wheel",
    "trl",
    "vllm>=0.17.0,<=0.25.1",
    "codecarbon==3.2.9",
    "wandb==0.27.2",
    "trackio==0.32.2",
    "liger-kernel==0.8.0",
]
tests = [
    "torch>=2.0",
    "transformers==5.14.0",
    "datasets>=2.0",
    "tokenizers==0.22.2",
    "sentencepiece==0.2.1",
    "protobuf",
    "pandas",
    "tabulate",
    "tqdm",
    "numpy",
    "pyyaml",
    "nltk",
    "langdetect",
    "immutabledict",
    "packaging",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
