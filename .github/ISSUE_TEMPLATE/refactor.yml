name: "\U0001F527 Refactor"
description: Propose a refactoring or code-quality improvement to the LLM Foundry codebase
labels: [ "refactor" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a refactor! 🤗

        Refactors should be small, mechanical, and behavior-preserving. Before you submit:

          - Read the [contributing guide](https://github.com/Polygl0t/llm-foundry/blob/main/CONTRIBUTING.md).
          - Search the open issues to make sure the change has not already been proposed.

  - type: textarea
    id: refactor-description
    validations:
      required: true
    attributes:
      label: Refactor proposal
      description: |
        A clear and concise description of the proposed refactoring. Explain what is being moved,
        renamed, or deduplicated, and why the current code needs changing. If relevant, link any
        upstream issue or reference implementation it is based on.

  - type: textarea
    id: motivation
    validations:
      required: true
    attributes:
      label: Motivation
      description: |
        Why is this refactor needed? e.g. duplicated logic across modules, confusing structure,
        inconsistent naming, dead code. If this is related to another GitHub issue, link it here.

  - type: textarea
    id: scope
    attributes:
      label: Scope and files affected
      description: |
        List the files and symbols (functions, classes, modules) this change would touch. For
        deduplication, indicate which symbols are identical across which files.
      placeholder: |
        - `data/formatting/utils.py` and `data/tokenization/utils.py`: `list_matching_files`, `infer_file_features`
        - New file: `shared/files.py`

  - type: textarea
    id: proposed-structure
    validations:
      required: true
    attributes:
      label: Proposed structure
      description: |
        Describe the target structure: where code should live, how it should be re-exported, and
        any module/docstring updates (e.g. `shared/__init__.py`, `shared/README.md`).

  - type: textarea
    id: behavior
    attributes:
      label: Behavior preservation
      description: |
        Confirm that the change is behavior-preserving. Note any test suites that cover the
        affected code (e.g. `pytest tests/tests_data_formatting.py`) and how the change can be
        verified.
      placeholder: "No behavior change expected. Verified by `pytest`."

  - type: textarea
    id: contribution
    validations:
      required: true
    attributes:
      label: Your contribution
      description: |
        Is there any way that you could help, e.g. by submitting a PR? Make sure to read
        [CONTRIBUTING.md](https://github.com/Polygl0t/llm-foundry/blob/main/CONTRIBUTING.md) first.
