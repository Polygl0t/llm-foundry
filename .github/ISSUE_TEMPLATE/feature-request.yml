name: "\U0001F680 Feature request"
description: Submit a proposal/request for a new LLM Foundry feature
labels: [ "Feature request" ]
body:
  - type: textarea
    id: feature-request
    validations:
      required: true
    attributes:
      label: Feature request
      description: |
        A clear and concise description of the feature proposal. If relevant, include links to any
        paper, reference implementation, or upstream issue it is based on.

  - type: textarea
    id: motivation
    validations:
      required: true
    attributes:
      label: Motivation
      description: |
        Please outline the motivation for the proposal. Is your feature request related to a problem?
        e.g., I'm always frustrated when [...]. If this is related to another GitHub issue, please link
        it here too.

  - type: textarea
    id: contribution
    validations:
      required: true
    attributes:
      label: Your contribution
      description: |
        Is there any way that you could help, e.g. by submitting a PR? Make sure to read
        [CONTRIBUTING.md](https://github.com/Polygl0t/llm-foundry/blob/main/CONTRIBUTING.md) first.
