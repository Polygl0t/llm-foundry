name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install dependencies
        run: |
          # CPU-only torch avoids pulling multi-GB CUDA wheels on the runner.
          uv pip install --system "torch>=2.13.0" --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -e ".[tests]"
      - name: Run the test suite
        run: pytest tests/ -v

  modules:
    name: module stack detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run module loading tests
        # The script always exits 0, so fail on its summary line instead.
        run: |
          bash tests/test_modules.sh | tee modules.log
          grep -q "OVERALL: PASS" modules.log
