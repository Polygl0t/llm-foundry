# ============================================================================
# Fully Sharded Data Parallel v2 (FSDP2) Configuration for Accelerate/Transformers
# ============================================================================
# Used by Accelerate to set up FSDP2 training (`torch.distributed.fsdp.fully_shard`).
# More configs: https://github.com/huggingface/trl/blob/main/examples/accelerate_configs
# Accelerate docs: https://huggingface.co/docs/accelerate/en/usage_guides/fsdp
# FSDP1 -> FSDP2 migration: `accelerate to-fsdp2 --config_file <fsdp1.yaml>`
# ============================================================================

# Compute Environment Configuration
# ----------------------------------
compute_environment: LOCAL_MACHINE
debug: false                        # Enable debug mode for verbose logging (set to true for debugging)
distributed_type: FSDP              # Distributed training type: FSDP (Fully Sharded Data Parallel)
enable_cpu_affinity: true           # Enable CPU affinity for better NUMA performance

# FSDP-Specific Configuration
# ----------------------------
fsdp_config:
  # FSDP Version: 2 = `fully_shard` + DTensor parameters (recommended, needs torch >= 2.6).
  fsdp_version: 2

  # State Dict Type: how checkpoints are written and gathered.
  # FULL_STATE_DICT is REQUIRED by the alignment trainers.
  fsdp_state_dict_type: FULL_STATE_DICT

  # Reshard After Forward: free the gathered parameters again after the forward pass.
  # `true`  = ZeRO-3-style: least memory, one all-gather per group per forward/backward.
  # `false` = ZeRO-2-style: parameters stay gathered, less traffic, more memory.
  fsdp_reshard_after_forward: true

  # Auto-wrap Policy: which submodules become their own shard group.
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP

  # Activation Checkpointing: FSDP's own per-group recompute.
  # MUST stay false here: the trainers pass `--gradient_checkpointing` and the HF
  # Trainer raises when both are on ("The activation_checkpointing in FSDP config and
  # the gradient_checkpointing in training arg can't be set to True simultaneously").
  fsdp_activation_checkpointing: false

  # CPU RAM peak during model load.
  # `true`: only rank 0 loads the weights.
  # `false`: every rank loads the full (bf16) model on CPU, `fully_shard` shards it.
  # Kept FALSE because it is only safe for a single model: the DPO trainer also shards a
  # REFERENCE model through TRL's `prepare_fsdp`, which does not broadcast, so non-rank-0
  # processes would keep empty tensors (silently wrong reference log-probs).
  # `dpo_trainer.py` raises on that combination. Flip it to true for SFT-only runs if
  # the rank-0 CPU peak is a problem.
  fsdp_cpu_ram_efficient_loading: false

  # Parameter Offloading: offload parameters to CPU when not in use.
  # Significantly reduces GPU memory but slows training down a lot.
  fsdp_offload_params: false

# Multi-Node Configuration
# -------------------------
# NOTE: the alignment job scripts (slurm/*.sh, via $ACCELERATE_CONFIG) OVERRIDE every
# key in this section on the `accelerate launch` command line, deriving them from
# Slurm, so multi-node needs `--nodes=N` in the SBATCH header and nothing else:
#     --num_machines $SLURM_NNODES
#     --num_processes <nodes x GPUs per node>     # TOTAL across all nodes
#     --machine_rank $SLURM_NODEID
#     --main_process_ip <first allocated node>    # MASTER_ADDR
#     --main_process_port <49152 + SLURM_JOB_ID % 16384>
# The values below are the single-node defaults.
# To run multi-node WITHOUT the job scripts, start this once on EVERY node, each with
# its own rank (and --num_processes = num_machines x GPUs per node):
#     accelerate launch --config_file .fsdp_config.yaml \
#         --num_machines 2 --num_processes 8 --machine_rank $RANK \
#         --main_process_ip <node0> --main_process_port 29500 \
#         --rdzv_backend static train.py
# Under FSDP the per-process memory is shared, so num_processes can exceed the model
# size; `fsdp_reshard_after_forward` (above) controls how much is kept gathered.
#
# SHARDING SCOPE: without a `parallelism_config`, FSDP2 shards over the WHOLE job
# (all nodes x all GPUs), so a small model on many nodes turns every layer into a
# cross-node all-gather. To shard per node and replicate across nodes instead (HSDP,
# ZeRO-2+ / `HYBRID_SHARD` equivalent), add the split to the device mesh:
#     parallelism_config:
#       dp_replicate_size: <num_machines>
#       dp_shard_size: <GPUs per machine>
machine_rank: 0                     # Rank of THIS machine (overridden per node)
main_process_ip: null               # Node 0's address. MUST be set for multi-node.
main_process_port: null             # Null -> accelerate uses 29500; the job scripts
                                    # pass a port derived from SLURM_JOB_ID instead.
main_training_function: main        # Entry point function name in your training script
num_machines: 1                     # Total machines. MUST be > 1 for multi-node.
gpu_ids: all                        # GPUs per machine ("all" = every visible GPU)
num_processes: 4                    # TOTAL processes = num_machines x GPUs per machine

# Distributed Backend Configuration
# ------------------------
rdzv_backend: static                # Rendezvous backend for multi-node setup (static for fixed IP/port)
same_network: true                  # Whether all machines are on the same network (true for single-node)

# Precision Configuration
# -----------------------
mixed_precision: bf16               # Mixed precision training mode
                                    # Accelerate turns this into an FSDP2 MixedPrecisionPolicy
                                    # (param/reduce/output dtype = bf16). The trainers also pass
                                    # --bf16, which the HF Trainer forwards as mixed_precision.
                                    # Options: "no" (fp32), "fp16", "bf16" (recommended for A100/H100)
                                    # bf16 provides better numerical stability than fp16
                                    # Reduces memory usage and speeds up training
downcast_bf16: 'no'                 # Whether when using bf16 precision on TPUs if both float and double
                                    # tensors are cast to bfloat16 or if double tensors remain as float32.

# TPU Configuration
# -----------------------------------
tpu_env: []                         # TPU-specific environment variables (leave empty for GPU training)
tpu_use_cluster: false              # Use TPU cluster (false for GPU training)
tpu_use_sudo: false                 # Require sudo for TPU operations (false for GPU training)

# CPU Training
# ------------
use_cpu: false                      # Use CPU instead of GPU (false for GPU training)
