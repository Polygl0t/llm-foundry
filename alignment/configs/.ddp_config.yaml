# ============================================================================
# Distributed Data Parallel (DDP) Configuration for Accelerate/Transformers
# ============================================================================
# This configuration file is used by Accelerate to set up DDP training.
# DDP replicates the model on each GPU and synchronizes gradients across GPUs.
# Accelerate Documentation: https://huggingface.co/docs/accelerate/package_reference/cli
# ============================================================================

# Compute Environment Configuration
# ----------------------------------
compute_environment: LOCAL_MACHINE
debug: false                        # Enable debug mode for verbose logging (set to true for debugging)
distributed_type: MULTI_GPU         # Use standard PyTorch DDP across multiple GPUs
enable_cpu_affinity: true           # Enable CPU affinity for better NUMA performance

# Multi-Node Configuration
# -------------------------
# NOTE: the alignment job scripts (slurm/*.sh, via $ACCELERATE_CONFIG) OVERRIDE every
# key in this section on the `accelerate launch` command line, deriving them from
# Slurm, so multi-node needs `--nodes=N` in the SBATCH header and nothing else:
#     --num_machines $SLURM_NNODES
#     --num_processes <nodes x GPUs per node>     # TOTAL across all nodes
#     --machine_rank $SLURM_NODEID
#     --main_process_ip <first allocated node>    # MASTER_ADDR
#     --main_process_port <49152 + SLURM_JOB_ID % 16384>
# The values below are the single-node defaults, used when this file is run on its
# own (e.g. `accelerate launch --config_file .ddp_config.yaml --num_processes 2 ...`).
# To run multi-node WITHOUT the job scripts, start this once on EVERY node, each with
# its own rank (and --num_processes = num_machines x GPUs per node):
#     accelerate launch --config_file .ddp_config.yaml \
#         --num_machines 2 --num_processes 8 --machine_rank $RANK \
#         --main_process_ip <node0> --main_process_port 29500 \
#         --rdzv_backend static train.py
machine_rank: 0                     # Rank of THIS machine (overridden per node)
main_process_ip: null               # Node 0's address. MUST be set for multi-node.
main_process_port: null             # Null -> accelerate uses 29500; the job scripts
                                    # pass a port derived from SLURM_JOB_ID instead.
main_training_function: main        # Entry point function name in your training script
num_machines: 1                     # Total machines. MUST be > 1 for multi-node.
gpu_ids: all                        # GPUs per machine ("all" = every visible GPU)
num_processes: 4                    # TOTAL processes = num_machines x GPUs per machine
                                    # (each process holds a full model replica under DDP)

# Distributed Backend Configuration
# ------------------------
rdzv_backend: static                # Rendezvous backend for multi-node setup (static for fixed IP/port)
same_network: true                  # Whether all machines are on the same network (true for single-node)

# Precision Configuration
# -----------------------
mixed_precision: bf16               # Mixed precision training mode
                                    # Options: "no" (fp32), "fp16", "bf16" (recommended for A100/H100)
                                    # bf16 provides better numerical stability than fp16
                                    # Reduces memory usage and speeds up training
downcast_bf16: 'no'                 # Whether when using bf16 precision on TPUs if both float and double
                                    # tensors are cast to bfloat16 or if double tensors remain as float32.

# TPU Configuration
# -----------------------------------
tpu_env: []                         # TPU-specific environment variables (leave empty for GPU training)
tpu_use_cluster: false              # Use TPU cluster (false for GPU training)
tpu_use_sudo: false                 # Require sudo for TPU operations (false for GPU training)

# CPU Training
# ------------
use_cpu: false                      # Use CPU instead of GPU (false for GPU training)
